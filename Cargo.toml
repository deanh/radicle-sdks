[workspace]
members = ["python/native", "node/native"]
default-members = ["python/native"]
resolver = "3"

[workspace.dependencies]
# Both adapters are source-coupled to this exact upstream API.
radicle = "=0.25.1"
# Upstream disables defaults but uses indexmap's std-only default hasher.
indexmap = { version = "2", features = ["std"] }
