[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "radicle-py"
version = "0.1.0"
description = "Python bindings for the radicle crate"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
strip = true
include = [
    { path = "python/radiclepy/py.typed", format = ["sdist", "wheel"] },
    { path = "python/radiclepy/__init__.pyi", format = ["sdist", "wheel"] },
    { path = "python/radiclepy/_types.pyi", format = ["sdist", "wheel"] },
]
