name: Node SDK (Linux x86_64)

on:
  push:
    branches: [main]
    paths: ['node/**', 'python/**', 'Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'uv.lock',
            'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/node.yml',
            'examples/**', 'tests/**']
  pull_request:
    paths: ['node/**', 'python/**', 'Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'uv.lock',
            'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/node.yml',
            'examples/**', 'tests/**']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - name: Packed consumer (npm 11; runtime, docs and types; no Rust sources)
        run: npm exec --yes --package npm@11.20.0 -- bash node/scripts/tarball-install-smoke.sh
      - name: Packed consumer (npm 12; runtime, docs and types; no Rust sources)
        run: npm exec --yes --package npm@12.2.0 -- bash node/scripts/tarball-install-smoke.sh
      # examples/ must print identical output from both SDKs; with both builds
      # present the cross-SDK tests must run, so a missing build fails, not skips.
      - uses: astral-sh/setup-uv@v3
      - name: Cross-SDK examples (Python and TypeScript digests)
        env:
          RADICLE_REQUIRE_CROSS_SDK: '1'
        run: |
          uv sync --dev --locked
          uv run maturin develop --uv
          uv run pytest -q tests/test_examples.py
      - run: cargo test --release -p radicle-sdk-native --locked
      - name: Abort-mode native builds remain rejected
        run: |
          if cargo rustc --release -p radicle-sdk-native --locked --lib -- -C panic=abort > "$RUNNER_TEMP/abort-build.log" 2>&1; then
            echo 'unexpected successful panic=abort build'
            exit 1
          fi
          grep -F 'radicle-sdk requires panic=unwind' "$RUNNER_TEMP/abort-build.log"
      - run: cargo clippy -p radicle-sdk-native --all-targets --locked -- -D warnings
      - name: Exact-commit root Git install (npm 11)
        run: bash node/scripts/git-install-smoke.sh npm11 "$GITHUB_SHA"
      - name: Exact-commit root Git install (npm 12, explicit Git approval)
        run: bash node/scripts/git-install-smoke.sh npm12 "$GITHUB_SHA"
      - name: Exact-commit root Git install (pnpm, approved build scripts)
        run: bash node/scripts/git-install-smoke.sh pnpm "$GITHUB_SHA"
      - name: Bun source install and runtime (best effort)
        continue-on-error: true
        run: bash node/scripts/git-install-smoke.sh bun "$GITHUB_SHA"
      # Measured MSRV: radicle 0.25.1 declares 1.88.0 but fails on 1.88-1.90
      # (E0382, cob/identity.rs:506). Re-measure on every radicle pin bump.
      - name: Minimum supported Rust (1.91)
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 check -p radicle-sdk-native --locked
