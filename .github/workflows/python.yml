name: Python SDK

# Release pipeline for `radicle-py` (Phase 6 polish of the Phase 0A gate).
#
# Gates:
#   * test job — MSRV (1.91) + stable, pytest on the test build, clippy on
#     BOTH feature states (test-helpers vs the release surface).
#   * wheels — glibc manylinux_2_28 x86_64 AND aarch64 (native arm64
#     runner; no QEMU), macOS universal2. Linux wheels are auditwheel
#     `show`+`repair`ed (NOT `check` alone) and the native-architecture
#     wheel is installed and imported in a clean venv.
#   * sdist — `maturin sdist`, installed from source in a clean venv and
#     smoke-tested (proves the source distribution is self-contained;
#     libgit2 and SQLite build from vendor, no system packages).
#
# Both artifact smokes run the SAME script, `python/tests/wheel_smoke.py` — the
# single source of truth for release purity + version integrity.
#
# Deliberately NO musl tooling — we validate glibc manylinux wheels.
# Windows is out of scope for v1 (README: unsupported/unverified).
# Alpha distribution is via a pinned Git URI. Artifacts are validation aids;
# there is no PyPI publication step.

on:
  push:
    branches: [main, alpha-rc]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test / rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.91 = measured MSRV: radicle 0.25.1 declares 1.88.0 but fails to
        # compile on 1.88-1.90 (E0382, cob/identity.rs:506). Re-measure on
        # every radicle pin bump; stable guards drift.
        rust: ["1.91", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync --dev --locked

      - name: Build extension (test-helpers for deterministic fixtures)
        run: uv run maturin develop --uv --features test-helpers

      # `--no-sync`: a plain `uv run` may re-sync and rebuild the extension
      # without `test-helpers`; the fixtures would then skip silently.
      - name: Run tests
        env:
          RADICLE_REQUIRE_TEST_HELPERS: "1"
        run: uv run --no-sync pytest -q -rs

      - name: Validate installed Python typing surface
        run: |
          uv run --no-sync python -m mypy.stubtest radiclepy --allowlist python/tests/stubtest-allowlist.txt
          uv run --no-sync mypy --strict python/tests/typing/usage.py
          uv run --no-sync pyright python/tests/typing/usage.py
          uv run --no-sync pyright --verifytypes radiclepy --ignoreexternal

      - name: Clippy (feature state used by tests)
        run: cargo clippy -p radicle-py --all-targets --locked --features test-helpers -- -D warnings

      - name: Clippy (release surface)
        run: cargo clippy -p radicle-py --all-targets --locked -- -D warnings

      - name: Rustfmt
        run: cargo fmt -p radicle-py -- --check

  wheels:
    name: wheel / ${{ matrix.kind }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: manylinux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          # Native arm64 runner — the manylinux_2_28 aarch64 image runs
          # under the container, no cross-toolchain, no QEMU.
          - kind: manylinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - kind: macos-universal2
            os: macos-14
            target: universal2-apple-darwin
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Audit + repair wheel (manylinux compliance, Linux only)
        if: runner.os == 'Linux'
        run: |
          pipx run auditwheel show dist/*.whl
          pipx run auditwheel repair --plat ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'manylinux_2_28_x86_64' || 'manylinux_2_28_aarch64' }} dist/*.whl -w dist/repaired
          # The REPAIRED wheel is the release artifact: replace the original
          # so the smoke test installs (and pip can accidentally choose) and
          # the upload contain exactly one wheel per platform.
          rm dist/*.whl
          mv dist/repaired/*.whl dist/
          rmdir dist/repaired

      # Install the FINAL artifact (repaired, originals removed) in a clean
      # venv and run python/tests/wheel_smoke.py: version integrity (metadata + tag
      # match) and release purity (plan §5.7 — no `_from_seed`, and no
      # `radiclepy._test` in sys.modules / importable).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Smoke-test the wheel on oldest supported Python
        run: |
          python -m venv .venv-oldest
          .venv-oldest/bin/pip install --no-index --find-links dist radicle-py
          .venv-oldest/bin/python python/tests/wheel_smoke.py
          source .venv-oldest/bin/activate
          python -m pip install 'pytest>=8' 'mypy>=1.15,<3' 'pyright>=1.1.400,<2'
          python -m pytest -q python/tests/test_ux.py python/tests/test_value_semantics.py python/tests/test_readme.py
          python -m mypy.stubtest radiclepy --allowlist python/tests/stubtest-allowlist.txt
          python -m mypy --strict python/tests/typing/usage.py
          pyright --pythonpath "$VIRTUAL_ENV/bin/python" python/tests/typing/usage.py
          # Verify installed annotations outside the source/config search tree.
          (cd "$RUNNER_TEMP" && pyright --pythonpath "$VIRTUAL_ENV/bin/python" --verifytypes radiclepy --ignoreexternal)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Smoke-test the wheel
        env:
          # Non-empty only on tag runs; must match the packaged version.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install --no-index --find-links dist radicle-py
          .venv-smoke/bin/python python/tests/wheel_smoke.py
          .venv-smoke/bin/pip install 'pytest>=8'
          .venv-smoke/bin/python -m pytest -q python/tests/test_ux.py python/tests/test_value_semantics.py python/tests/test_readme.py
          echo "wheel smoke OK (${{ matrix.kind }})"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.kind }}
          path: dist/*.whl

  macos-intel-smoke:
    name: universal2 / Intel / Python ${{ matrix.python }}
    needs: wheels
    runs-on: macos-15-intel
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m venv .venv-intel
          .venv-intel/bin/pip install --no-index --find-links dist radicle-py
          .venv-intel/bin/python python/tests/wheel_smoke.py

  git-install:
    name: alpha / Git URI install
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install the exact checked-out commit via Git URI
        run: |
          python -m venv .venv-git
          .venv-git/bin/pip install "git+file://${GITHUB_WORKSPACE}@${GITHUB_SHA}"
          .venv-git/bin/python python/tests/wheel_smoke.py

  sdist:
    name: build / source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed by the clean-venv `pip install` below: building from sdist
      # compiles the extension from source.
      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3

      - name: Build sdist
        run: uvx --from 'maturin>=1.7,<2' maturin sdist --out dist

      - name: Install unpacked sdist offline in a clean venv
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          # Cache dependencies first; offline means source closure, not vendoring.
          cargo fetch --locked
          python3 -m venv .venv-sdist
          .venv-sdist/bin/pip install 'maturin>=1.7,<2'
          # The no-isolation backend invokes the maturin executable by name.
          export PATH="$PWD/.venv-sdist/bin:$PATH"
          interpreter="$PWD/.venv-sdist/bin/python"
          source_dir=$(mktemp -d)
          tar -xf dist/*.tar.gz -C "$source_dir"
          cd "$source_dir"/radicle_py-*
          cp Cargo.lock before-build.lock
          CARGO_NET_OFFLINE=true "$interpreter" -m pip install --no-index --no-build-isolation --no-deps .
          # Maturin trims Node members; Cargo may prune unused lock records,
          # but must not add new package/version/source selections offline.
          "$interpreter" - <<'PY'
          import tomllib
          from pathlib import Path
          def selections(path):
              return {(p['name'], p['version'], p.get('source'))
                      for p in tomllib.loads(Path(path).read_text())['package']}
          assert selections('Cargo.lock') <= selections('before-build.lock')
          PY
          cd "$GITHUB_WORKSPACE"
          "$interpreter" python/tests/wheel_smoke.py
          echo "offline sdist smoke OK"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
