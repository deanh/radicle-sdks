name: wheels

# Phase 1+: build the real `radiclepy` extension in maturin's glibc
# manylinux_2_28 container and audit the result. (wheel-probe/ served its
# Phase 0A purpose; this job now targets the root project.)
# Deliberately NO musl tooling — we validate glibc manylinux wheels.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test / rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 = declared MSRV (radicle 0.25.1); stable guards drift.
        rust: ["1.88", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync --dev --locked

      - name: Build extension (test-helpers for deterministic fixtures)
        run: uv run maturin develop --uv --features test-helpers

      - name: Run tests
        run: uv run pytest -q

      - name: Clippy (feature state used by tests)
        run: cargo clippy --all-targets --locked --features test-helpers -- -D warnings

      - name: Clippy (release surface)
        run: cargo clippy --all-targets --locked -- -D warnings

  manylinux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel (maturin-action, glibc manylinux_2_28 container)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_28"
          args: --release --out dist

      - name: Audit wheel (manylinux compliance)
        run: |
          pipx run auditwheel show dist/*.whl
          pipx run auditwheel repair --plat manylinux_2_28_x86_64 dist/*.whl -w dist/repaired

      - name: Smoke-test the wheel (import + identifier roundtrip)
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --no-index --find-links dist/repaired radicle-py
          .venv-smoke/bin/python -c "
          import radiclepy as rad
          p = rad.Profile.init('.smoke-home', 'ci')
          assert rad.parse_did(p.did) == p.did
          assert p.signer().node_id == p.node_id
          # Deterministic seeding must NOT ship in release wheels (plan §5.7).
          assert not hasattr(rad.Profile, '_from_seed'), 'test helper leaked into release'
          assert rad.RepoId is str and rad.Did is str
          print('wheel smoke OK:', p.did)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/repaired/*.whl
