[package]
name = "radicle-sdk-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
radicle.workspace = true
getrandom = "0.3"
# Explicit std-only default hasher even when building this adapter alone.
indexmap.workspace = true

[build-dependencies]
napi-build = "2"

[dev-dependencies]
static_assertions = "1"
